name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-checks:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (TypeScript type check)
        run: pnpm run lint

      - name: Generate app icon
        run: pnpm run build:icon

      - name: Build web
        run: pnpm run build

      - name: Build Electron
        run: pnpm run build:electron

      - name: Run all tests
        run: pnpm run test

      - name: Verify no plaintext API keys in committed source
        run: |
          Write-Host "Scanning for hardcoded encryption keys and plaintext credential storage..."
          $key = Select-String -Path "electron/main.ts" -Pattern "API_KEY_ENCRYPTION_KEY"
          if ($key) { Write-Host "FAIL: Hardcoded encryption key found"; exit 1 } else { Write-Host "OK: No hardcoded encryption key" }
          $ls1 = Select-String -Path "src/stores/app-store.tsx" -Pattern "localStorage\.setItem\([^)]*apiKey"
          if ($ls1) { Write-Host "FAIL: Plaintext API key in localStorage"; exit 1 } else { Write-Host "OK: No plaintext API key in localStorage" }
          $ls2 = Select-String -Path "src/desktop/browser-preview-bridge.ts" -Pattern "localStorage\.setItem\([^)]*apiKey"
          if ($ls2) { Write-Host "FAIL: Plaintext API key persisted in browser preview"; exit 1 } else { Write-Host "OK: No plaintext API key in browser preview storage" }

      - name: Verify safeStorage is used for credentials
        run: |
          $ss = Select-String -Path "electron/main.ts" -Pattern "safeStorage"
          if ($ss) { Write-Host "OK: Electron safeStorage (DPAPI) used for credentials" } else { Write-Host "FAIL: safeStorage not found"; exit 1 }

      - name: Verify HTML escaping in chat exports
        run: |
          $eh = Select-String -Path "src/components/dialogs/ExportChatModal.tsx" -Pattern "escapeHtml"
          if ($eh) { Write-Host "OK: HTML escaping function present in ExportChatModal" } else { Write-Host "FAIL: escapeHtml missing"; exit 1 }

  clean-checkout-package:
    name: Clean-checkout Windows package
    needs: security-checks
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (TypeScript type check)
        run: pnpm run lint

      - name: Build and package
        run: pnpm run electron:build

      - name: Verify release assets
        run: |
          if (-not (Test-Path 'release')) {
            Write-Host "FAIL: release directory was not created"
            exit 1
          }
          $assets = Get-ChildItem 'release' -File | Where-Object {
            $_.Name -like '*.exe' -or $_.Name -like '*.nsis' -or $_.Name -like '*.portable'
          }
          if (-not $assets -or $assets.Count -eq 0) {
            Write-Host "FAIL: no installer/portable artifacts found"
            Get-ChildItem 'release' -Recurse
            exit 1
          }
          Write-Host ("OK: " + $assets.Count + " release asset(s) produced")
          $assets | ForEach-Object { Write-Host ("  " + $_.FullName) }
