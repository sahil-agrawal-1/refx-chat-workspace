name: Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-checks:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (TypeScript type check)
        run: pnpm run lint

      - name: Build web
        run: pnpm run build

      - name: Build Electron
        run: pnpm run build:electron

      - name: Run all tests
        run: |
          pnpm tsx src/stores/app-store.test.tsx
          pnpm tsx src/stores/security.test.ts
          pnpm tsx src/utils/diff.test.ts

      - name: Verify no plaintext API keys in committed source
        run: |
          @echo "Scanning for hardcoded encryption keys and plaintext credential storage..."
          if (Select-String -Path "electron/main.ts" -Pattern "API_KEY_ENCRYPTION_KEY") { Write-Host "FAIL: Hardcoded encryption key found"; exit 1 } else { Write-Host "OK: No hardcoded encryption key" }
          if (Select-String -Path "src/stores/app-store.tsx" -Pattern "apiKey.*localStorage|localStorage.*apiKey") { Write-Host "FAIL: Plaintext API key in localStorage"; exit 1 } else { Write-Host "OK: No plaintext API key in localStorage" }
          if (Select-String -Path "src/desktop/browser-preview-bridge.ts" -Pattern "apiKey.*setItem|setItem.*apiKey") { Write-Host "FAIL: Plaintext API key persisted in browser preview"; exit 1 } else { Write-Host "OK: No plaintext API key in browser preview storage" }

      - name: Verify safeStorage is used for credentials
        run: |
          if (Select-String -Path "electron/main.ts" -Pattern "safeStorage\.encryptString|safeStorage\.decryptString|safeStorage\.isEncryptionAvailable") { Write-Host "OK: Electron safeStorage (DPAPI) used for credentials" } else { Write-Host "FAIL: safeStorage not found"; exit 1 }

      - name: Verify HTML escaping in chat exports
        run: |
          if (Select-String -Path "src/components/dialogs/ExportChatModal.tsx" -Pattern "escapeHtml") { Write-Host "OK: HTML escaping function present in ExportChatModal" } else { Write-Host "FAIL: escapeHtml missing"; exit 1 }

    outputs:
      security-status: ${{ job.status }}
